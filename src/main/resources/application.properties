spring.application.name=sigetur-backend

# Le dice a Java qué librería usar para hablar con PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Solo busca schema.sql y data.sql en src/main/resources/ se deja en always para pruebas en desarrollo
spring.sql.init.mode=always

server.port=8080
# Direccion web para ver y probar tus rutas
springdoc.swagger-ui.path=/docs

# Revisa que tus clases Java coincidan con las tablas de PostgreSQL sin modificarlas
spring.jpa.hibernate.ddl-auto=validate

# Muestra en la consola el SQL que se ejecuta por debajo
spring.jpa.show-sql=true
